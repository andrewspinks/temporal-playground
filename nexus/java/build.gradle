plugins {
    id 'java'
    id 'application'
}

// java.net.http.HttpClient (used by TodoActivitiesImpl) needs 11+.
sourceCompatibility = '11'
targetCompatibility = '11'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'io.temporal:temporal-sdk:1.35.0'
    implementation 'io.temporal:temporal-envconfig:1.35.0'
    implementation 'ch.qos.logback:logback-classic:1.5.6'
}

application {
    mainClass = project.findProperty('mainClass') ?: 'io.temporal.nexusjobs.handler.NexusHandlerWorker'
}
